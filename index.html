<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>Расписание преподавателей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="search-area">
      <h1>Расписание преподавателей</h1>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/>
        </svg>
        <input
          id="teacherSearch"
          type="search"
          placeholder="Введите ФИО преподавателя"
          autocomplete="off"
          spellcheck="false"
          aria-label="Поиск преподавателя"
        >
        <button id="clearSearch" class="clear" type="button" aria-label="Очистить">×</button>
      </div>

      <div id="suggestions" class="suggestions" hidden></div>
    </section>

    <section id="schedule" class="schedule" aria-live="polite">
      <div class="empty">Введите ФИО преподавателя</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
